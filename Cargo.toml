[package]
name = "rsnap"
version = "0.1.0"
edition = "2024"
authors = ["RAPL Group, s.r.o."]
license = "MIT"
repository = "https://github.com/EmperorHeyman/RSnap"
description = "Tiny Win+Shift+S snipping tool: live screen, glow frame, named clipboard file"

[dependencies]
png = "0.18.1"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
